# Builds ready-to-run copies for Windows, macOS and Linux.
# - Push a tag such as v0.5.0: the builds are also published as a release of that name on the repository's
#   Releases page, with the tag's message as its description. Anyone can download them there, with no
#   GitHub account, and they don't expire.
# - Or run it from the Actions tab (Build → Run workflow): the builds appear only under the run's Artifacts.
# The version shown in the app is the newest tag's (see Directory.Build.targets).
name: Build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write              # to publish a release when a tag is pushed
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the tags, which give the version shown in the app
      - name: Get the user guide (kept with the web version)
        uses: actions/checkout@v5
        with:
          repository: divided-eye/artist-feed
          path: web
          sparse-checkout: docs
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test tests/ArtistFeed.Tests
      - name: Publish
        run: |
          for rid in win-x64 osx-arm64 osx-x64 linux-x64; do
            dotnet publish src/ArtistFeed.App -c Release -r $rid --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none \
              -o publish/ArtistFeed-$rid
            rm -f publish/ArtistFeed-$rid/*.pdb      # debug data from the graphics libraries; the app doesn't use it
            cp web/docs/"Artist Feed User Guide.docx" web/docs/"Artist Feed User Guide.md" publish/ArtistFeed-$rid/
            cp LICENSE publish/ArtistFeed-$rid/LICENSE.txt
            cp src/ArtistFeed.App/Assets/ICON-NOTICE.txt publish/ArtistFeed-$rid/
          done
      - uses: actions/upload-artifact@v5
        with: { name: ArtistFeed-windows, path: publish/ArtistFeed-win-x64 }
      - uses: actions/upload-artifact@v5
        with: { name: ArtistFeed-mac-apple-silicon, path: publish/ArtistFeed-osx-arm64 }
      - uses: actions/upload-artifact@v5
        with: { name: ArtistFeed-mac-intel, path: publish/ArtistFeed-osx-x64 }
      - uses: actions/upload-artifact@v5
        with: { name: ArtistFeed-linux, path: publish/ArtistFeed-linux-x64 }
      - name: Publish a release (tag pushes only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd publish
          zip -qr ../ArtistFeed-windows.zip ArtistFeed-win-x64
          zip -qr ../ArtistFeed-mac-apple-silicon.zip ArtistFeed-osx-arm64
          zip -qr ../ArtistFeed-mac-intel.zip ArtistFeed-osx-x64
          zip -qr ../ArtistFeed-linux.zip ArtistFeed-linux-x64
          cd ..
          gh release create "$GITHUB_REF_NAME" ArtistFeed-windows.zip ArtistFeed-mac-apple-silicon.zip \
            ArtistFeed-mac-intel.zip ArtistFeed-linux.zip \
            --title "Artist Feed $GITHUB_REF_NAME" --notes-from-tag --verify-tag --latest
